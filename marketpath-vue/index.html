<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive, beginner-friendly platform for learning stock market and cryptocurrency fundamentals: lessons, chart reading, simulations, quizzes and risk education. All data is illustrative — never live market prices."
    />
    <meta
      name="keywords"
      content="learn investing, stock market basics, cryptocurrency for beginners, financial literacy, candlestick charts, portfolio simulator"
    />
    <title>MarketPath — Learn Stocks &amp; Crypto from Zero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before first paint (default: dark)
      (function () {
        try {
          var t = localStorage.getItem("marketpath-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-background text-foreground">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
